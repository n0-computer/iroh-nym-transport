[package]
name = "iroh-nym-transport"
version = "0.1.0"
edition = "2024"
description = "Nym mixnet transport for iroh"
license = "MIT OR Apache-2.0"
authors = ["Rüdiger Klaehn <rklaehn@protonmail.com>", "n0 team"]
repository = "https://github.com/n0-computer/iroh-nym-transport"
readme = "README.md"
keywords = ["iroh", "nym", "mixnet", "p2p", "privacy"]
categories = ["network-programming", "asynchronous"]

[dependencies]
nym-sdk = "1.20"
tokio = { version = "1", features = ["full"] }
iroh = { version = "1.0", features = ["unstable-custom-transports"] }
iroh-base = "1.0"
iroh-tickets = "1.0"
n0-error = "0.1"
bytes = "1"
n0-watcher = "1.0"
n0-future = "0.3"
noq-udp = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
postcard = "1"

[dev-dependencies]
anyhow = "1"
base64 = "0.22"
noq-proto = "0.16"

[[example]]
name = "hello"
path = "examples/hello.rs"

[[example]]
name = "chat"
path = "examples/chat.rs"

[[example]]
name = "inspect_addr"
path = "examples/inspect_addr.rs"

[[example]]
name = "test_size"
path = "examples/test_size.rs"

[[example]]
name = "echo"
path = "examples/echo.rs"
